<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>REST API Test | Pergola Resort</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f1; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 10px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px; }
        button { background: #456b3d; color: #fff; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        .note-card { border: 1px solid #ddd; padding: 10px; margin-top: 10px; border-radius: 4px; position: relative; }
        .delete-btn { position: absolute; right: 10px; top: 10px; background: #d9534f; }
    </style>
</head>
<body>

<div class="container">
    <h2>API Notes Manager</h2>
    
    <div class="form-group">
        <label>Title</label>
        <input type="text" id="title" placeholder="Note Title">
    </div>
    <div class="form-group">
        <label>Content</label>
        <textarea id="content" placeholder="Note Content"></textarea>
    </div>
    <button onclick="createNote()">Add Note</button>

    <hr style="margin: 20px 0;">

    <h3>Your Notes</h3>
    <div id="notesContainer">Loading...</div>
</div>

<script>
    const API_URL = 'api/notes.php';

    async function fetchNotes() {
        try {
            const res = await fetch(API_URL);
            if (res.status === 401) {
                document.getElementById('notesContainer').innerHTML = '<p style="color:red;">Error: Not authenticated. Please log in first.</p>';
                return;
            }
            const data = await res.json();
            
            if (data.length === 0) {
                document.getElementById('notesContainer').innerHTML = '<p>No notes found.</p>';
                return;
            }

            let html = '';
            data.forEach(note => {
                html += `
                    <div class="note-card">
                        <button class="delete-btn" onclick="deleteNote(${note.id})">Delete</button>
                        <h4>${escapeHtml(note.title)}</h4>
                        <p>${escapeHtml(note.content)}</p>
                        <small>Created: ${note.created_at}</small>
                    </div>
                `;
            });
            document.getElementById('notesContainer').innerHTML = html;
        } catch (err) {
            console.error(err);
        }
    }

    async function createNote() {
        const title = document.getElementById('title').value;
        const content = document.getElementById('content').value;

        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content })
        });

        if (res.ok) {
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            fetchNotes();
        } else {
            const err = await res.json();
            alert(err.error || 'Failed to create note.');
        }
    }

    async function deleteNote(id) {
        const res = await fetch(`${API_URL}?id=${id}`, { method: 'DELETE' });
        if (res.ok) {
            fetchNotes();
        } else {
            alert('Failed to delete note.');
        }
    }

    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    // Initial fetch
    fetchNotes();
</script>

</body>
</html>
